[package]
name = "solshield-policy"
version = "0.1.0"
description = "On-chain security policy PDA and transaction guard vault for SolShield"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solshield_policy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
