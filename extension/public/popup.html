<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolShield Browser Guard</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 380px;
        min-height: 460px;
        background: #07090f;
        color: #f1f5f9;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 14px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid #1e293b;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand img {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }
      .brand-title {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .brand-sub {
        font-size: 10px;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .toggle-btn {
        border: 1px solid #334155;
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        background: #101727;
        color: #cbd5e1;
      }
      .toggle-btn.active {
        background: rgba(16, 185, 129, 0.16);
        border-color: #10b981;
        color: #6ee7b7;
      }
      .toggle-btn.off {
        background: rgba(239, 68, 68, 0.16);
        border-color: #ef4444;
        color: #fca5a5;
      }
      .card {
        background: #0d1322;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 11px 12px;
        margin-bottom: 10px;
      }
      .card-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #64748b;
        font-weight: 700;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .host-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .hostname {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        font-weight: 700;
        color: #e2e8f0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        font-size: 10px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 999px;
        background: #1e293b;
        color: #cbd5e1;
        white-space: nowrap;
      }
      .pill.safe {
        background: rgba(16, 185, 129, 0.18);
        color: #6ee7b7;
      }
      .pill.warning {
        background: rgba(245, 158, 11, 0.18);
        color: #fcd34d;
      }
      .pill.block {
        background: rgba(239, 68, 68, 0.18);
        color: #fca5a5;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .chip {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 6px;
        background: #141d31;
        border: 1px solid #26334d;
        color: #cbd5e1;
      }
      .chip.frozen {
        border-color: #f59e0b;
        color: #fcd34d;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .btn {
        background: #121a2d;
        border: 1px solid #273451;
        color: #e2e8f0;
        border-radius: 9px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }
      .btn.primary {
        background: #2934ff;
        border-color: #2934ff;
        color: #ffffff;
      }
      .history-list {
        max-height: 175px;
        overflow-y: auto;
      }
      .history-item {
        padding: 7px 0;
        border-bottom: 1px dashed rgba(148, 163, 184, 0.15);
        font-size: 11px;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
      }
      .history-meta {
        color: #64748b;
        font-size: 10px;
      }
      .link-clear {
        background: none;
        border: none;
        color: #64748b;
        font-size: 10px;
        cursor: pointer;
        padding: 0;
      }
      .muted {
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">
        <img src="icons/icon48.png" alt="SolShield" />
        <div>
          <div class="brand-title">SOLSHIELD GUARD</div>
          <div class="brand-sub" id="endpoint-badge">M3 PRE-SIGN FIREWALL</div>
        </div>
      </div>
      <button id="toggle-enabled" class="toggle-btn active" type="button">
        ACTIVE
      </button>
    </div>

    <div class="card">
      <div class="card-label">
        <span>Active Tab Domain Guard</span>
        <span id="network-badge" class="pill">mainnet</span>
      </div>
      <div class="host-row">
        <span id="active-host" class="hostname">Checking tab...</span>
        <span id="domain-status-pill" class="pill">-</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label"><span>Wallet Hook Protection (M0)</span></div>
      <div id="provider-chips" class="chips">
        <span class="muted">No Solana wallet injected on this tab yet.</span>
      </div>
    </div>

    <div class="actions">
      <button id="open-options" class="btn primary" type="button">
        Settings &amp; API
      </button>
      <a id="open-web" class="btn" href="https://sol-shield.xyz" target="_blank" rel="noreferrer">
        Open SolShield Web
      </a>
    </div>

    <div class="card">
      <div class="card-label">
        <span>Recent Local Verdicts (Max 20)</span>
        <button id="clear-history" class="link-clear" type="button">Clear</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="muted">No local transaction audits recorded yet.</div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
