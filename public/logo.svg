<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Solana Signature Gradients -->
    <linearGradient id="solShieldGlow" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9945FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="shieldBorder" x1="120" y1="80" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="60%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#80ECFF"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="200" y1="180" x2="312" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#161e2e" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0b0e14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="#1f293d" stroke-width="2"/>

  <!-- Subtle Cyberpunk Grid / Circuit Nodes -->
  <g opacity="0.15" stroke="#14F195" stroke-width="1.5">
    <line x1="96" y1="140" x2="416" y2="140" stroke-dasharray="6 6"/>
    <line x1="96" y1="256" x2="416" y2="256" stroke-dasharray="6 6"/>
    <line x1="96" y1="372" x2="416" y2="372" stroke-dasharray="6 6"/>
    <line x1="170" y1="80" x2="170" y2="432" stroke-dasharray="6 6"/>
    <line x1="342" y1="80" x2="342" y2="432" stroke-dasharray="6 6"/>
  </g>

  <!-- Outer Ambient Shield Neon Glow -->
  <path d="M256 82 L388 138 C388 244 336 350 256 414 C176 350 124 244 124 138 Z"
        fill="none" stroke="url(#shieldBorder)" stroke-width="18" opacity="0.35" filter="url(#neonBlur)"/>

  <!-- Main Shield Body -->
  <path d="M256 92 L380 144 C380 240 330 340 256 398 C182 340 132 240 132 144 Z"
        fill="#0d121c" stroke="url(#shieldBorder)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Geometric Facets -->
  <path d="M256 96 L256 394 C324 338 370 244 370 148 Z" fill="#131a29" opacity="0.6"/>
  <path d="M256 96 L256 394 C188 338 142 244 142 148 Z" fill="#0d131f" opacity="0.8"/>

  <!-- Solana Triple-Tier Aesthetic Horizontal Bars (Inverted Chevron Guard) -->
  <g stroke-linecap="round" stroke-width="6">
    <path d="M196 172 L256 196 L316 172" stroke="#14F195" opacity="0.9"/>
    <path d="M184 212 L256 240 L328 212" stroke="#4be8b6" opacity="0.8"/>
    <path d="M196 254 L256 278 L316 254" stroke="#9945FF" opacity="0.9"/>
  </g>

  <!-- Central Venice AI Core / Shield Knot -->
  <circle cx="256" cy="236" r="42" fill="#080b11" stroke="url(#coreGlow)" stroke-width="5" filter="url(#neonBlur)"/>
  <circle cx="256" cy="236" r="28" fill="#121824" stroke="#14F195" stroke-width="3"/>

  <!-- Cryptographic Pulse / Security Check Node -->
  <path d="M242 236 L252 246 L272 224" stroke="#14F195" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Protective Orbit Nodes -->
  <circle cx="256" cy="116" r="5" fill="#14F195" filter="url(#neonBlur)"/>
  <circle cx="360" cy="162" r="4.5" fill="#9945FF"/>
  <circle cx="152" cy="162" r="4.5" fill="#14F195"/>
  <circle cx="256" cy="374" r="5" fill="#9945FF" filter="url(#neonBlur)"/>
</svg>
