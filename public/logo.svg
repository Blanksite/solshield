<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Retro CRT Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="512" y2="0" stroke="#000000" stroke-width="1.8" opacity="0.6"/>
    </pattern>

    <!-- Retro Phosphor Gradients -->
    <linearGradient id="retroPhosphor" x1="120" y1="100" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="65%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#FF3B81"/>
    </linearGradient>

    <linearGradient id="chassisGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="40%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>

    <filter id="crtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Heavy Beveled Retro Hardware Chassis Frame -->
  <rect x="24" y="24" width="464" height="464" rx="36" fill="url(#chassisGrad)" stroke="#2f3647" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="26" fill="#0c0f16" stroke="#171c26" stroke-width="3"/>

  <!-- Industrial Screw Rivets in 4 corners -->
  <g fill="#252c3d" stroke="#10141d" stroke-width="1.5">
    <circle cx="56" cy="56" r="7"/>
    <circle cx="456" cy="56" r="7"/>
    <circle cx="56" cy="456" r="7"/>
    <circle cx="456" cy="456" r="7"/>
  </g>
  <g stroke="#3f4a63" stroke-width="1.5" stroke-linecap="round">
    <line x1="53" y1="56" x2="59" y2="56"/>
    <line x1="453" y1="56" x2="459" y2="56"/>
    <line x1="53" y1="456" x2="59" y2="456"/>
    <line x1="453" y1="456" x2="459" y2="456"/>
  </g>

  <!-- Retro Screen Recess Bezel -->
  <rect x="64" y="64" width="384" height="384" rx="20" fill="#080a0f" stroke="#1f2638" stroke-width="2"/>

  <!-- CRT Monitor Glass Phosphor Ambient Glow -->
  <rect x="68" y="68" width="376" height="376" rx="18" fill="#14F195" opacity="0.04"/>

  <!-- Top Industrial Status Bar / Stencil Header -->
  <g fill="#14F195" opacity="0.75" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">
    <text x="84" y="96">SOL-GUARD // REV.86</text>
    <circle cx="396" cy="92" r="3.5" fill="#14F195"/>
    <circle cx="414" cy="92" r="3.5" fill="#9945FF"/>
  </g>
  <line x1="84" y1="106" x2="428" y2="106" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Retro Stepped / Chunky Pixel-Beveled Shield Silhouette -->
  <!-- Outer Shield Shell -->
  <path d="M 256 128
           L 384 168
           L 384 256
           L 352 320
           L 296 376
           L 256 408
           L 216 376
           L 160 320
           L 128 256
           L 128 168
           Z"
        fill="#111624" stroke="url(#retroPhosphor)" stroke-width="7" stroke-linejoin="miter" filter="url(#crtGlow)"/>

  <!-- Inner Stepped Pixel Grid Fill -->
  <path d="M 256 148
           L 364 182
           L 364 248
           L 336 304
           L 288 354
           L 256 382
           L 224 354
           L 176 304
           L 148 248
           L 148 182
           Z"
        fill="#080c14" stroke="#1f293d" stroke-width="3"/>

  <!-- Chunky Retro Solana Bars (Phosphor Slats) -->
  <g fill="none" stroke-linecap="square">
    <!-- Top Phosphor Green Slat -->
    <path d="M 180 196 L 256 220 L 332 196" stroke="#14F195" stroke-width="10"/>
    <path d="M 180 196 L 256 220 L 332 196" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

    <!-- Middle Cyan/Emerald Slat -->
    <path d="M 172 238 L 256 264 L 340 238" stroke="#00E5FF" stroke-width="9"/>

    <!-- Bottom Synthwave Purple/Magenta Slat -->
    <path d="M 180 280 L 256 306 L 332 280" stroke="#9945FF" stroke-width="10"/>
    <path d="M 180 280 L 256 306 L 332 280" stroke="#ff73f0" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Central 8-Bit Pixel Microchip Diamond Core -->
  <rect x="242" y="238" width="28" height="28" rx="4" transform="rotate(45 256 252)"
        fill="#0c101a" stroke="#14F195" stroke-width="4"/>
  <rect x="250" y="246" width="12" height="12" rx="2" transform="rotate(45 256 252)"
        fill="#14F195"/>

  <!-- Retro Phosphor Scanlines Overlay across Screen -->
  <rect x="68" y="68" width="376" height="376" rx="18" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Bottom Hardware Label Footer -->
  <g fill="#9945FF" opacity="0.8" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="3">
    <text x="188" y="430">[ VENICE.SEC ]</text>
  </g>
</svg>
